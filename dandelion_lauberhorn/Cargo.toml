[package]
name = "dandelion_lauberhorn"
version = "0.1.0"
edition = "2024"

[dependencies]
bindgen = "0.72.1"
log = "0.4.29"
dispatcher = { path = "../dispatcher" }
machine_interface = { path = "../machine_interface" }
dandelion_commons = { path = "../dandelion_commons" }
dandelion_server = { path = "../server" }
bson = "2.9.0"
strum = "0.28.0"
bytes = "1.11.1"
serde = "1.0.228"
tokio = { version = "1.51.1", features = ["full"] }
num_cpus = "1.17.0"
hyper = { version = "1.2", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto"] }
http-body-util = "0.1"
core_affinity = "0.8"
env_logger = "0.10.1"
reqwest = { version = "0.13.2", features = ["blocking", "json"] }
http = "1.4.0"

[features]
cheri = ["machine_interface/cheri", "dispatcher/cheri"]
mmu = ["machine_interface/mmu", "dispatcher/mmu"]
kvm = ["machine_interface/kvm", "dispatcher/kvm"]
